    <div class="page-header">
      <h1>Get a Free Quote</h1>
      <p>Tell us about your event and we’ll shine it up!</p>
    </div>

    <form id="enquiry-form" class="form-box" novalidate>
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" required minlength="2" placeholder="Your name" />

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com" />

      <label for="phone">Phone / WhatsApp</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        pattern="[0-9\s+()-]{8,20}"
        required
        placeholder="082 123 4567"
      />

      <label for="event">Event Type</label>
      <select id="event" name="event" required>
        <option value="">Please select</option>
        <option value="Wedding">Wedding</option>
        <option value="Birthday">Birthday</option>
        <option value="Graduation">Graduation</option>
        <option value="Corporate">Corporate</option>
        <option value="Other">Other</option>
      </select>

      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        rows="4"
        placeholder="Tell us more about your celebration"
      ></textarea>

      <button type="submit">Send Enquiry</button>
      <p id="enquiry-response" aria-live="polite"></p>
    </form>
